<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Rain Bird app showing 1 hour 40 minutes maximum manual duration</title>
  <desc id="desc">Privacy-safe illustration based on the official Rain Bird app manual zone duration selector, highlighting the maximum value of 1 h 40 min.</desc>
  <rect width="900" height="320" fill="#f3f3f3"/>
  <line x1="40" y1="70" x2="860" y2="70" stroke="#d8d8d8" stroke-width="4"/>
  <text x="720" y="142" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#444" text-anchor="middle">1 h 40 min</text>
  <line x1="40" y1="210" x2="760" y2="210" stroke="#158a38" stroke-width="8" stroke-linecap="round"/>
  <circle cx="760" cy="210" r="22" fill="#16a34a"/>
  <polyline points="820,118 842,96 864,118" fill="none" stroke="#158a38" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="820,182 842,204 864,182" fill="none" stroke="#158a38" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="275" x2="860" y2="275" stroke="#d8d8d8" stroke-width="4"/>
</svg>
